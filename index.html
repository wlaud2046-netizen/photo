<style>
  :root{
    --bg:#1C1F22; --surface:#24282D; --surface2:#2F343A; --border:#3B4149;
    --text:#ECECEC; --muted:#9AA0A6; --accent:#F2A93B; --accent-ink:#2A1C00;
    --danger:#E2574C;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:520px; margin:0 auto; padding:18px 18px 44px;}
  header{padding:20px 4px 18px; border-bottom:1px solid var(--border); margin-bottom:18px;}
  header h1{font-size:24px; margin:0 0 6px; letter-spacing:-0.01em; font-weight:800;}
  header p{margin:0; color:var(--muted); font-size:15px; line-height:1.4;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:16px;}
  .label{font-size:14px; color:var(--muted); margin-bottom:10px; display:block; font-weight:600;}

  .site-row{display:flex; gap:10px;}
  input[type=text]{
    flex:1; min-width:0; font-size:24px; font-weight:700; padding:16px 18px;
    background:var(--surface2); border:1.5px solid var(--border); border-radius:14px;
    color:var(--text); font-variant-numeric:tabular-nums;
  }
  input[type=text]:focus{outline:3px solid var(--accent); outline-offset:1px;}
  button{font:inherit; border:none; cursor:pointer;}
  .btn{
    padding:16px 20px; border-radius:14px; font-size:17px; font-weight:700;
    background:var(--surface2); color:var(--text); border:1.5px solid var(--border);
    min-height:56px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:scale(0.97);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  .active-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px;}
  .active-num{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; word-break:break-all;}
  .next-badge{
    font-size:14px; font-weight:800; color:var(--accent-ink); background:var(--accent);
    border-radius:999px; padding:7px 16px; white-space:nowrap; flex-shrink:0;
  }
  .empty-hint{color:var(--muted); font-size:15px; text-align:center; padding:24px 8px;}

  .shots{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;}
  .shot{position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; border:1.5px solid var(--border);}
  .shot img{width:100%; height:100%; object-fit:cover; display:block;}
  .shot span.tag{
    position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.7); color:#fff;
    font-size:13px; font-weight:800; padding:2px 8px; border-radius:7px;
  }
  .shot .del-x{
    position:absolute; top:5px; right:5px; width:28px; height:28px; border-radius:50%;
    background:var(--danger); color:#fff; font-size:16px; font-weight:800; line-height:1;
    display:flex; align-items:center; justify-content:center; border:2px solid var(--bg); padding:0;
  }
  .shot .del-x:active{transform:scale(0.9);}

  .cam-row{display:flex; gap:10px;}
  .cam-row .btn{flex:1;}
  #undoBtn{flex:0 0 auto; min-width:76px; min-height:48px; padding:10px 14px; font-size:15px;}
  .cam-area{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:6px 0 4px;}
  .cam-side{flex:1; display:flex; justify-content:flex-end;}
  .cam-side:first-child{justify-content:flex-start;}
  .cam-center{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .cam-big{
    width:132px; height:132px; border-radius:50%; padding:0;
    background:radial-gradient(circle at 35% 30%, #FF6B5E 0%, #E5261B 60%, #C41810 100%);
    border:6px solid rgba(255,255,255,.92);
    box-shadow:0 0 0 5px rgba(229,38,27,.35), 0 8px 22px rgba(229,38,27,.45);
    display:flex; align-items:center; justify-content:center; transition:transform .1s;
  }
  .cam-big:active{transform:scale(.93);}
  .cam-big svg{width:64px; height:64px; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));}
  .cam-big-label{font-size:19px; font-weight:800; color:#FF6B5E; letter-spacing:-.01em;}
  .btn-blue{background:#2F7DF6; border-color:#2F7DF6; color:#fff;}
  .btn-blue:active{background:#1F66D8;}

  /* 연속 촬영 오버레이 */
  .camOverlay{
    position:fixed; inset:0; background:#000; z-index:100;
    display:none; flex-direction:column;
  }
  .camOverlay.open{display:flex;}
  .camTop{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;
    color:#fff; position:relative; z-index:2;
  }
  .camTop .num{font-weight:800; font-size:19px; font-variant-numeric:tabular-nums;}
  .camTop .count{font-size:14px; color:#ccc; margin-top:2px;}
  .camClose{
    background:rgba(255,255,255,.15); color:#fff; border-radius:999px;
    width:42px; height:42px; font-size:19px; display:flex; align-items:center; justify-content:center;
  }
  .camStage{flex:1; position:relative; overflow:hidden; background:#000;}
  #camVideo{width:100%; height:100%; object-fit:cover; display:block;}
  .camFlash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .camFlash.flash{animation:flashAnim .25s ease-out;}
  @keyframes flashAnim{0%{opacity:.85;}100%{opacity:0;}}

  .camFilm{
    display:flex; gap:8px; overflow-x:auto; padding:12px 16px;
    background:#000;
  }
  .camFilm .thumb{
    flex:0 0 auto; width:58px; height:58px; border-radius:9px; overflow:hidden;
    border:2px solid rgba(255,255,255,.4); position:relative;
  }
  .camFilm .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .camFilm .thumb span{
    position:absolute; right:3px; bottom:3px; background:rgba(0,0,0,.7); color:#fff;
    font-size:11px; font-weight:800; padding:0 4px; border-radius:4px;
  }
  .camBottom{
    display:flex; align-items:center; justify-content:center; gap:46px;
    padding:16px 24px calc(env(safe-area-inset-bottom,0px) + 22px);
    background:#000; position:relative;
  }
  .camUndo{
    color:#fff; background:none; font-size:14px; opacity:.85; min-width:62px; text-align:center;
  }
  .camUndo:disabled{opacity:.3;}
  .shutter{
    width:78px; height:78px; border-radius:50%; background:#fff; border:5px solid rgba(255,255,255,.35);
    padding:0;
  }
  .shutter:active{background:#ddd;}
  .camDone{
    background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:15px;
    border-radius:999px; padding:12px 20px; min-width:62px;
  }

  .sites-list{margin-top:4px;}
  .site-group{border-bottom:1px solid var(--border);}
  .site-group:last-child{border-bottom:none;}
  .site-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 4px; font-size:17px; cursor:pointer; gap:10px;
  }
  .site-item .n{font-weight:800; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:8px; min-width:0; word-break:break-all;}
  .site-item .n .chev{color:var(--muted); font-size:13px; transition:transform .15s; flex-shrink:0;}
  .site-item .n .chev.open{transform:rotate(90deg);}
  .site-item .right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .site-item .c{color:var(--muted); font-size:14px;}
  .icon-btn{padding:8px; font-size:20px; line-height:1; border-radius:10px;}
  .icon-btn:active{background:var(--surface2);}
  .site-del{color:var(--danger);}
  .site-thumbs{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
    padding:0 4px 16px;
  }

  .footer-actions{position:sticky; bottom:0; padding-top:12px; background:linear-gradient(to top, var(--bg) 70%, transparent);}
  .total-line{color:var(--muted); font-size:14px; text-align:center; margin-bottom:10px; font-weight:600;}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:#111; color:#fff; padding:13px 20px; border-radius:12px; font-size:15px;
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:85%; text-align:center;
  }
  .toast.show{opacity:1;}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.72); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal-box{background:var(--surface); border:1.5px solid var(--border); border-radius:20px; padding:24px 20px 20px; width:100%; max-width:420px;}
  .modal-box h2{margin:0 0 12px; font-size:21px; font-weight:800;}
  .modal-box p{margin:0 0 20px; font-size:16px; line-height:1.55; color:var(--text);}
  .modal-box p small{display:block; margin-top:10px; color:var(--muted); font-size:14px;}
  .modal-btns{display:flex; gap:10px;}
  .modal-btns .btn{flex:1;}

  .example-card{padding:16px 16px 14px;}
  .example-head{display:flex; align-items:center; justify-content:space-between; cursor:pointer; -webkit-user-select:none; user-select:none;}
  .example-head .label{margin-bottom:0;}
  .example-head .chev{color:var(--muted); font-size:13px; transition:transform .15s;}
  .example-head .chev.open{transform:rotate(90deg);}
  .example-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px;}
  .example-item img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:12px; border:1.5px solid var(--border); display:block;}
  .example-item .cap{font-size:12.5px; color:var(--muted); text-align:center; margin-top:7px; font-weight:700; line-height:1.3;}
</style>
</head>

<script>
(function(){
  const sites = [];           // {num, photos:[{letter, blob, url, id}], expanded}
  let active = null;          // {num, photos:[{letter, blob, url, id}]}

  // ---- 촬영 예시 카드 접기/펼치기 ----
  const exampleHead=document.getElementById('exampleHead'), exampleGrid=document.getElementById('exampleGrid'), exampleChev=document.getElementById('exampleChev');
  if(exampleHead){
    exampleHead.addEventListener('click', ()=>{
      const open = exampleGrid.style.display !== 'none';
      exampleGrid.style.display = open ? 'none' : 'grid';
      exampleChev.classList.toggle('open', !open);
    });
  }

  // ---- 자동 백업 (IndexedDB) ----
  // 안드로이드에서 카메라 앱을 호출했다가 돌아올 때 브라우저 탭이 통째로
  // 리셋되는 경우가 있어, 사진을 찍는 즉시 기기에 저장해두고 다음에 페이지를
  // 다시 열었을 때 자동으로 복구한다. 메모리(JS 변수)만 믿지 않는다.
  let dbPromise = null;
  function getDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve)=>{
      if(!window.indexedDB){ resolve(null); return; }
      const req = indexedDB.open('manholePhotoBackup', 1);
      req.onupgradeneeded = ()=>{
        req.result.createObjectStore('shots', {keyPath:'id'});
      };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>resolve(null);
    });
    return dbPromise;
  }
  async function dbPut(rec){
    const db = await getDB();
    if(!db) return;
    await new Promise(res=>{
      try{
        const tx = db.transaction('shots','readwrite');
        tx.objectStore('shots').put(rec);
        tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); tx.onabort = ()=>res();
      }catch(e){ res(); }
    });
  }
  async function dbDeleteById(id){
    const db = await getDB();
    if(!db) return;
    try{
      db.transaction('shots','readwrite').objectStore('shots').delete(id);
    }catch(e){}
  }
  async function dbGetAll(){
    const db = await getDB();
    if(!db) return [];
    return new Promise(resolve=>{
      try{
        const req = db.transaction('shots','readonly').objectStore('shots').getAll();
        req.onsuccess = ()=>resolve(req.result||[]);
        req.onerror = ()=>resolve([]);
      }catch(e){ resolve([]); }
    });
  }
  async function dbClear(){
    const db = await getDB();
    if(!db) return;
    await new Promise(res=>{
      try{
        const tx = db.transaction('shots','readwrite');
        tx.objectStore('shots').clear();
        tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); tx.onabort = ()=>res();
      }catch(e){ res(); }
    });
  }
  async function dbDeleteByNum(num){
    const db = await getDB();
    if(!db) return;
    try{
      const store = db.transaction('shots','readwrite').objectStore('shots');
      const req = store.getAll();
      req.onsuccess = ()=>{
        (req.result||[]).forEach(r=>{ if(r.num===num) store.delete(r.id); });
      };
    }catch(e){}
  }
  async function dbRenameNum(oldNum, newNum){
    const db = await getDB();
    if(!db) return;
    try{
      const store = db.transaction('shots','readwrite').objectStore('shots');
      const req = store.getAll();
      req.onsuccess = ()=>{
        (req.result||[]).forEach(r=>{
          if(r.num===oldNum){
            store.delete(r.id);
            const newId = newNum+'__'+r.letter+'__'+(++backupSeq);
            store.put({ id:newId, num:newNum, letter:r.letter, blob:r.blob, ts:r.ts });
          }
        });
      };
    }catch(e){}
  }
  // 다운로드를 시도했다는 표시만 남긴다 (사진 백업은 지우지 않음).
  // 다운로드가 취소/실패해도 사진이 날아가지 않도록, 초기화는 사용자가 직접 '예'를 눌렀을 때만 한다.
  async function markDownloaded(){
    await dbPut({ id:'__meta__', downloaded:true, ts:Date.now() });
  }
  let backupSeq = 0;
  function backupPhoto(num, letter, blob){
    backupSeq++;
    const id = num+'__'+letter+'__'+backupSeq;
    dbPut({ id, num, letter, blob, ts:Date.now() });
    return id;
  }
  // 사진 삭제 후 남은 사진들의 글자(S,A,C,B,D...)를 다시 순서대로 매기고,
  // 백업 DB도 새 글자에 맞춰 다시 저장한다 (지점 전체를 지우고 다시 넣음)
  async function relabelAndResync(num, photos){
    photos.forEach((p,i)=>{ p.letter = letterFor(i); });
    await dbDeleteByNum(num);
    photos.forEach(p=>{ p.id = backupPhoto(num, p.letter, p.blob); });
  }

  const $ = id => document.getElementById(id);
  const siteInput=$('siteInput'), startBtn=$('startBtn'), activeCard=$('activeCard'),
        activeNum=$('activeNum'), nextBadge=$('nextBadge'), shotsEl=$('shots'),
        emptyHint=$('emptyHint'), camBtn=$('camBtn'),
        undoBtn=$('undoBtn'), finishBtn=$('finishBtn'), listCard=$('listCard'),
        sitesList=$('sitesList'), downloadBtn=$('downloadBtn'), totalLine=$('totalLine'),
        toast=$('toast');

  // 촬영 순서별 파일 글자: 1번째 S, 2번째 A, 3번째 C, 4번째 B, 5번째 D, 6번째 E, 7번째 F, 8번째 G, 9번째 H, 이후 I, J, K...
  const LETTER_SEQ = ['S','A','C','B','D','E','F','G','H'];
  function letterFor(i){
    if(i < LETTER_SEQ.length) return LETTER_SEQ[i];
    const n = i - LETTER_SEQ.length;      // 0 → I
    const c = String.fromCharCode(73 + (n % 18)); // I..Z
    const round = Math.floor(n / 18);
    return round ? c + (round+1) : c;
  }

  // ---- 사진 용량 자동 압축 (목표: 약 400KB 이하) ----
  const TARGET_BYTES = 380*1024; // 400KB 이하 보장(여유 포함)
  const MAX_EDGE = 2560;
  function canvasToBlob(canvas, q){
    return new Promise(res=>canvas.toBlob(b=>res(b), 'image/jpeg', q));
  }
  async function loadBitmap(blob){
    if(window.createImageBitmap){
      try{ return await createImageBitmap(blob, {imageOrientation:'from-image'}); }catch(e){}
      try{ return await createImageBitmap(blob); }catch(e){}
    }
    return new Promise((resolve,reject)=>{
      const img = new Image();
      const u = URL.createObjectURL(blob);
      img.onload = ()=>{ URL.revokeObjectURL(u); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(u); reject(new Error('img')); };
      img.src = u;
    });
  }
  async function compressToTarget(blob){
    try{
      const bmp = await loadBitmap(blob);
      let w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
      const longEdge = Math.max(w,h);
      let scale = longEdge > MAX_EDGE ? MAX_EDGE/longEdge : 1;
      let best = null;
      for(let attempt=0; attempt<8; attempt++){
        const cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(bmp, 0, 0, cw, ch);
        // 품질 이진탐색 (0.45 ~ 0.92)
        let lo = 0.45, hi = 0.92, fit = null;
        let b = await canvasToBlob(canvas, hi);
        if(b && b.size <= TARGET_BYTES){ fit = b; }
        else{
          for(let i=0;i<6;i++){
            const mid = (lo+hi)/2;
            b = await canvasToBlob(canvas, mid);
            if(!b) break;
            if(b.size <= TARGET_BYTES){ fit = b; lo = mid; } else { hi = mid; }
          }
        }
        if(fit){ best = fit; break; }
        scale *= 0.85; // 그래도 크면 해상도를 줄여 다시 시도
      }
      if(bmp.close) try{ bmp.close(); }catch(e){}
      return best || blob;
    }catch(e){
      return blob; // 압축 실패 시 원본 유지
    }
  }
  // 촬영 순서대로 하나씩 압축/저장 (글자가 겹치지 않도록)
  let compressQueue = Promise.resolve();

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'), 1800);
  }

  function startSite(){
    const v = siteInput.value.trim();
    if(!v){ showToast('맨홀번호를 입력하세요'); return; }
    if(active && active.photos.length === 0){
      // 이전 지점에 사진이 없으면 그냥 번호만 교체
    } else if(active){
      commitActive();
    }
    // 같은 번호가 '완료된 지점'에 이미 있으면(중간에 탭이 리셋됐던 경우 등)
    // 새로 시작하지 않고 기존 사진 뒤에 이어서 찍는다 (파일명 겹침 방지)
    const existingIdx = sites.findIndex(s=>s.num===v);
    if(existingIdx!==-1){
      active = sites.splice(existingIdx,1)[0];
      showToast(`'${v}' 지점에 이어서 촬영합니다 (기존 ${active.photos.length}장 + 계속)`);
    } else {
      active = {num:v, photos:[]};
    }
    siteInput.value='';
    renderActive();
  }

  function commitActive(){
    if(active && active.photos.length>0){
      sites.push(active);
    }
  }

  function renderActive(){
    if(!active){ activeCard.style.display='none'; return; }
    activeCard.style.display='block';
    activeNum.textContent = active.num;
    nextBadge.textContent = '다음: ' + letterFor(active.photos.length);
    shotsEl.innerHTML='';
    active.photos.forEach((p,i)=>{
      const d = document.createElement('div');
      d.className='shot';
      d.innerHTML = `<img src="${p.url}"><span class="tag">${active.num}-${p.letter}</span><button class="del-x" data-idx="${i}" title="사진 삭제">✕</button>`;
      shotsEl.appendChild(d);
    });
    emptyHint.style.display = active.photos.length ? 'none' : 'block';
    renderSummary();
  }

  shotsEl.addEventListener('click', (e)=>{
    const btn = e.target.closest('.del-x');
    if(!btn || !active) return;
    const idx = Number(btn.dataset.idx);
    deletePhotoFromActive(idx);
  });

  async function deletePhotoFromActive(idx){
    const p = active.photos[idx];
    if(!p) return;
    if(!confirm(`'${active.num}-${p.letter}' 사진을 삭제할까요?`)) return;
    active.photos.splice(idx,1);
    URL.revokeObjectURL(p.url);
    await relabelAndResync(active.num, active.photos);
    renderActive();
    showToast('사진을 삭제했습니다');
  }

  function renderSitesList(){
    sitesList.innerHTML='';
    if(sites.length===0){ listCard.style.display='none'; return; }
    listCard.style.display='block';
    sites.forEach((s,idx)=>{
      const group = document.createElement('div');
      group.className = 'site-group';

      const row = document.createElement('div');
      row.className = 'site-item';
      row.innerHTML = `
        <span class="n"><span class="chev${s.expanded?' open':''}">▶</span>${s.num}</span>
        <span class="right">
          <span class="c">${s.photos.length}장</span>
          <button class="icon-btn site-edit" data-idx="${idx}" title="이름 변경">✏️</button>
          <button class="icon-btn site-del" data-idx="${idx}" title="이 지점 삭제">🗑</button>
        </span>`;
      row.addEventListener('click', (e)=>{
        if(e.target.closest('.site-del') || e.target.closest('.site-edit')) return;
        s.expanded = !s.expanded;
        renderSitesList();
      });
      row.querySelector('.site-del').addEventListener('click', (e)=>{
        e.stopPropagation();
        deleteSite(idx);
      });
      row.querySelector('.site-edit').addEventListener('click', (e)=>{
        e.stopPropagation();
        renameSite(idx);
      });
      group.appendChild(row);

      if(s.expanded){
        const thumbs = document.createElement('div');
        thumbs.className = 'site-thumbs';
        s.photos.forEach((p,pi)=>{
          const d = document.createElement('div');
          d.className = 'shot';
          d.innerHTML = `<img src="${p.url}"><span class="tag">${s.num}-${p.letter}</span><button class="del-x" data-site="${idx}" data-idx="${pi}" title="사진 삭제">✕</button>`;
          thumbs.appendChild(d);
        });
        thumbs.addEventListener('click', (e)=>{
          const btn = e.target.closest('.del-x');
          if(!btn) return;
          e.stopPropagation();
          const siteIdx = Number(btn.dataset.site);
          const photoIdx = Number(btn.dataset.idx);
          deletePhotoFromSite(siteIdx, photoIdx);
        });
        group.appendChild(thumbs);
      }
      sitesList.appendChild(group);
    });
  }

  async function deletePhotoFromSite(siteIdx, photoIdx){
    const s = sites[siteIdx];
    if(!s) return;
    const p = s.photos[photoIdx];
    if(!p) return;
    if(!confirm(`'${s.num}-${p.letter}' 사진을 삭제할까요?`)) return;
    s.photos.splice(photoIdx,1);
    URL.revokeObjectURL(p.url);
    await relabelAndResync(s.num, s.photos);
    renderSitesList();
    renderSummary();
    showToast('사진을 삭제했습니다');
  }

  function deleteSite(idx){
    const s = sites[idx];
    if(!s) return;
    if(!confirm(`'${s.num}' 지점 사진 ${s.photos.length}장을 삭제할까요?`)) return;
    s.photos.forEach(p=>URL.revokeObjectURL(p.url));
    sites.splice(idx,1);
    dbDeleteByNum(s.num);
    renderSummary();
  }

  function renameSite(idx){
    const s = sites[idx];
    if(!s) return;
    const next = prompt('새 맨홀번호/지점명을 입력하세요', s.num);
    if(next===null) return; // 취소
    const trimmed = next.trim();
    if(!trimmed || trimmed===s.num) return;
    if(sites.some((other,i)=> i!==idx && other.num===trimmed)){
      if(!confirm(`'${trimmed}' 지점이 이미 있습니다. 두 지점을 합칠까요? (사진 글자가 겹치면 수동으로 확인이 필요할 수 있습니다)`)) return;
    }
    const old = s.num;
    s.num = trimmed;
    dbRenameNum(old, trimmed);
    renderSummary();
  }

  function renderSummary(){
    renderSitesList();
    const activeCount = active ? active.photos.length : 0;
    const totalSites = sites.length + (active && active.photos.length>0 ? 1 : 0);
    const totalPhotos = sites.reduce((a,s)=>a+s.photos.length,0) + activeCount;
    totalLine.textContent = totalSites>0 ? `지점 ${totalSites}곳 · 사진 ${totalPhotos}장` : '';
    downloadBtn.disabled = totalPhotos===0;
  }

  startBtn.addEventListener('click', startSite);
  siteInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startSite(); });

  // ---- 연속 촬영 (페이지 안에서 카메라를 켜두고 여러 장을 계속 찍은 뒤 한 번에 반영) ----
  const camOverlay=$('camOverlay'), camVideo=$('camVideo'), camFlash=$('camFlash'),
        camFilm=$('camFilm'), camTopNum=$('camTopNum'), camTopCount=$('camTopCount'),
        shutterBtn=$('shutterBtn'), camUndoBtn=$('camUndoBtn'),
        camDoneBtn=$('camDoneBtn'), camDoneTopBtn=$('camDoneTopBtn'), camCancelBtn=$('camCancelBtn');

  let camStream = null;
  let session = null; // {photos:[{letter,blob,url}]} - 이번 촬영 세션에서 새로 찍은 것

  function stopStream(){
    if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
  }

  function renderCamOverlay(){
    camTopNum.textContent = active.num;
    camTopCount.textContent = session.photos.length + '장 촬영됨';
    camFilm.innerHTML = '';
    session.photos.forEach(p=>{
      const d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = `<img src="${p.url}"><span>${p.letter}</span>`;
      camFilm.appendChild(d);
    });
    camFilm.scrollLeft = camFilm.scrollWidth;
    camUndoBtn.disabled = session.photos.length === 0;
  }

  let liveCameraUnavailable = false;

  async function openLiveCamera(){
    if(!active){ showToast('먼저 맨홀번호를 입력하고 시작하세요'); return; }
    if(liveCameraUnavailable || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      openFallbackCamera();
      return;
    }
    try{
      camStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} },
        audio:false
      });
    }catch(err){
      // 권한 거부/플랫폼 제한 등 → 기본 카메라 앱(체이닝) 방식으로 대체하고, 이후에는 재시도하지 않는다.
      liveCameraUnavailable = true;
      openFallbackCamera();
      return;
    }
    session = { photos:[] };
    camVideo.srcObject = camStream;
    camOverlay.classList.add('open');
    renderCamOverlay();
  }

  async function closeLiveCamera(commit){
    stopStream();
    camOverlay.classList.remove('open');
    await compressQueue; // 압축 중인 사진이 있으면 끝날 때까지 기다림
    const s = session;
    if(commit && s && s.photos.length>0 && active){
      active.photos.push(...s.photos);
      renderActive();
    } else if(!commit && s){
      // 취소: 세션에서 찍은 임시 사진 URL 정리
      s.photos.forEach(p=>URL.revokeObjectURL(p.url));
    }
    if(session===s) session = null;
  }

  shutterBtn.addEventListener('click', ()=>{
    if(!session || !camVideo.videoWidth) return;
    const canvas = document.createElement('canvas');
    canvas.width = camVideo.videoWidth;
    canvas.height = camVideo.videoHeight;
    canvas.getContext('2d').drawImage(camVideo, 0, 0);
    canvas.toBlob(blob=>{
      if(!blob) return;
      const sess = session, act = active;
      compressQueue = compressQueue.then(async ()=>{
        const small = await compressToTarget(blob);
        const letter = letterFor(act.photos.length + sess.photos.length);
        const url = URL.createObjectURL(small);
        const id = backupPhoto(act.num, letter, small);
        sess.photos.push({letter, blob:small, url, id});
        if(session===sess) renderCamOverlay();
      });
    }, 'image/jpeg', 0.92);
    camFlash.classList.remove('flash'); void camFlash.offsetWidth; camFlash.classList.add('flash');
    if(navigator.vibrate) navigator.vibrate(15);
  });

  camUndoBtn.addEventListener('click', ()=>{
    if(session && session.photos.length>0){
      const p = session.photos.pop();
      URL.revokeObjectURL(p.url);
      dbDeleteById(p.id);
      renderCamOverlay();
    }
  });

  camDoneBtn.addEventListener('click', ()=>closeLiveCamera(true));
  camDoneTopBtn.addEventListener('click', ()=>closeLiveCamera(true));
  camCancelBtn.addEventListener('click', ()=>{
    if(session && session.photos.length>0){
      if(!confirm('지금까지 찍은 ' + session.photos.length + '장을 저장하지 않고 닫을까요?')) return;
    }
    closeLiveCamera(false);
  });

  // ---- 대체 방식: getUserMedia를 못 쓰는 환경(아이폰 Safari 등)에서는
  // OS 카메라 화면("다시 찍기/사진 사용")을 코드로 없앨 수 없다. 대신 "사진 사용"을
  // 누르는 즉시 카메라를 자동으로 다시 열어서, 우리 쪽 버튼을 매번 누르지 않고
  // 계속 이어서 찍을 수 있게 체이닝한다. 카메라 화면에서 "X"(취소)를 누르면 멈춘다.
  let chaining = false;

  function openFallbackCamera(){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.style.display = 'none';
    input.addEventListener('change', ()=>{
      const file = input.files[0];
      if(file && active){
        const target = active;
        showToast('사진 압축 중...');
        compressQueue = compressQueue.then(async ()=>{
          const small = await compressToTarget(file);
          const letter = letterFor(target.photos.length);
          const url = URL.createObjectURL(small);
          const id = backupPhoto(target.num, letter, small);
          target.photos.push({letter, blob:small, url, id});
          if(active===target) renderActive(); else renderSummary();
        });
        input.remove();
        // 바로 다음 촬영을 위해 카메라를 다시 연다 (사용자가 또 버튼을 누를 필요 없음)
        openFallbackCamera();
      } else {
        // 카메라 화면에서 취소함 → 체인 종료
        input.remove();
        chaining = false;
      }
    });
    document.body.appendChild(input);
    input.click();
  }

  function startCapture(){
    if(!active){ showToast('먼저 맨홀번호를 입력하고 시작하세요'); return; }
    chaining = true;
    openLiveCamera();
  }

  camBtn.addEventListener('click', startCapture);
  window.addEventListener('pagehide', stopStream);

  undoBtn.addEventListener('click', ()=>{
    if(active && active.photos.length>0){
      const p = active.photos.pop();
      URL.revokeObjectURL(p.url);
      dbDeleteById(p.id);
      renderActive();
    }
  });

  finishBtn.addEventListener('click', ()=>{
    if(!active || active.photos.length===0){ showToast('촬영한 사진이 없습니다'); return; }
    commitActive();
    active = null;
    activeCard.style.display='none';
    renderSummary();
    siteInput.focus();
    showToast('지점 저장됨. 다음 맨홀번호를 입력하세요');
  });

  async function runDownload(fnameBase){
    const all = sites.slice();
    if(active && active.photos.length>0) all.push(active);
    if(all.length===0) return;

    downloadBtn.disabled = true;
    downloadBtn.textContent = '압축 중...';

    try{
      const zip = new JSZip();
      all.forEach(s=>{
        const folder = zip.folder(s.num);
        s.photos.forEach(p=>{
          folder.file(`${s.num}-${p.letter}.jpg`, p.blob);
        });
      });
      const content = await zip.generateAsync({type:'blob'});

      const downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
      const fname = fnameBase + '.zip';
      if(downloads){
        try{
          await downloads.save({filename:fname, data:content});
          showToast('다운로드 요청 완료 · 사진 백업은 그대로 보관됩니다');
          await markDownloaded();
        }catch(err){
          if(err && err.code==='declined'){ /* 사용자가 취소함 → 백업은 남겨둔다 */ }
          else showToast('다운로드 실패: ' + (err && err.message ? err.message : '알 수 없는 오류'));
        }
      } else if(!/Android/i.test(navigator.userAgent) && navigator.canShare && typeof File==='function' && navigator.canShare({files:[new File([content],fname,{type:'application/zip'})]})){
        try{
          await navigator.share({files:[new File([content],fname,{type:'application/zip'})], title:fname});
          showToast('저장/공유 완료 · 사진 백업은 그대로 보관됩니다');
          await markDownloaded();
        }catch(err){
          if(!(err && err.name==='AbortError')) showToast('저장 실패: ' + (err && err.message ? err.message : '알 수 없는 오류'));
        }
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(content);
        a.download = fname;
        a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(()=>{ a.remove(); URL.revokeObjectURL(a.href); }, 3000);
        showToast('다운로드 시작됨 · 파일이 저장됐는지 확인하세요 (사진 백업은 그대로 보관)');
        await markDownloaded();
      }
    }catch(e){
      showToast('압축 중 오류가 발생했습니다');
    }finally{
      downloadBtn.disabled = false;
      downloadBtn.textContent = '전체 다운로드 (ZIP)';
    }
  }

  // ---- 다운로드 단계: 전체 다운로드 → 파일 다운로드(취소/다운로드) → 파일명 변경 → 확인 ----
  function pad2(n){ return String(n).padStart(2,'0'); }
  function defaultFileBase(){
    const d = new Date();
    return `맨홀조사사진_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`;
  }
  function cleanFileBase(v){
    v = (v||'').replace(/[\\\/:*?"<>|]/g,'').trim().replace(/\.zip$/i,'').trim();
    return v;
  }
  function showModal(html){
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = '<div class="modal-box" role="dialog" aria-modal="true">'+html+'</div>';
    document.body.appendChild(ov);
    return ov;
  }
  function openDownloadConfirm(){
    const all = sites.slice();
    if(active && active.photos.length>0) all.push(active);
    if(all.length===0){ showToast('다운로드할 사진이 없습니다'); return; }
    const photos = all.reduce((a,s)=>a+s.photos.length,0);
    const ov = showModal(`
      <h2>파일 다운로드</h2>
      <p>지점 ${all.length}곳 · 사진 ${photos}장을<br>ZIP 파일로 다운로드할까요?</p>
      <div class="modal-btns">
        <button class="btn" id="dlCancelBtn">취소</button>
        <button class="btn btn-accent" id="dlOkBtn">다운로드</button>
      </div>`);
    ov.querySelector('#dlCancelBtn').addEventListener('click', ()=>ov.remove());
    ov.querySelector('#dlOkBtn').addEventListener('click', ()=>{ ov.remove(); openFileNameDialog(); });
  }
  function openFileNameDialog(){
    const ov = showModal(`
      <h2>파일명 변경</h2>
      <p style="margin-bottom:12px;">저장할 파일 이름을 확인하거나 바꿔주세요.</p>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:20px;">
        <input type="text" id="fileNameInput" style="font-size:18px; padding:14px;" autocomplete="off">
        <span style="font-weight:800; color:var(--muted);">.zip</span>
      </div>
      <div class="modal-btns">
        <button class="btn" id="fnCancelBtn">취소</button>
        <button class="btn btn-accent" id="fnOkBtn">확인</button>
      </div>`);
    const input = ov.querySelector('#fileNameInput');
    input.value = defaultFileBase();
    setTimeout(()=>{ input.focus(); input.select(); }, 50);
    const go = ()=>{
      const base = cleanFileBase(input.value) || defaultFileBase();
      ov.remove();
      runDownload(base);
    };
    ov.querySelector('#fnCancelBtn').addEventListener('click', ()=>ov.remove());
    ov.querySelector('#fnOkBtn').addEventListener('click', go);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  }
  downloadBtn.addEventListener('click', openDownloadConfirm);

  async function restoreFromBackup(){
    const allRecords = await dbGetAll();
    const meta = allRecords.find(r=>r.id==='__meta__');
    const records = allRecords.filter(r=>r.id!=='__meta__');
    if(!records.length){ if(meta) await dbClear(); return; }
    records.sort((a,b)=>a.ts-b.ts);
    const order = [];
    const groups = {};
    records.forEach(r=>{
      if(!groups[r.num]){ groups[r.num] = []; order.push(r.num); }
      groups[r.num].push({ letter:r.letter, blob:r.blob, url:URL.createObjectURL(r.blob), id:r.id });
    });
    let total = 0;
    order.forEach(num=>{
      groups[num].forEach((p,i)=>{ p.letter = letterFor(i); });
      sites.push({ num, photos: groups[num] });
      total += groups[num].length;
    });
    renderSummary();
    showToast(`이전에 찍어둔 사진 ${total}장을 복구했습니다 (${order.length}개 지점) · 확인 후 다운로드하세요`);
    if(meta) askResetAfterDownload(total, order.length);
  }

  // 다운로드 시도 후 다시 열렸을 때: 초기화 여부를 직접 물어본다
  function askResetAfterDownload(total, siteCount){
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `
      <div class="modal-box" role="dialog" aria-modal="true">
        <h2>데이터를 초기화하시겠습니까?</h2>
        <p>이전에 ZIP 다운로드를 진행했습니다.<br>폰에 보관 중인 사진 <b>${total}장</b>(${siteCount}개 지점)을 삭제하고 새로 시작할까요?
        <small>다운로드를 취소했거나 파일이 저장됐는지 확실하지 않다면 <b>아니오</b>를 선택하세요. 사진은 그대로 유지됩니다.</small></p>
        <div class="modal-btns">
          <button class="btn" id="resetNoBtn">아니오 (유지)</button>
          <button class="btn btn-danger" id="resetYesBtn">예 (초기화)</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#resetNoBtn').addEventListener('click', async ()=>{
      // 사진은 유지하고, 다운로드 표시만 지운다 (다음 새로고침 때 다시 묻지 않음)
      const db = await getDB();
      if(db){
        await new Promise(res=>{
          try{
            const tx = db.transaction('shots','readwrite');
            tx.objectStore('shots').delete('__meta__');
            tx.oncomplete = ()=>res(); tx.onerror = ()=>res(); tx.onabort = ()=>res();
          }catch(e){ res(); }
        });
      }
      ov.remove();
      showToast('사진을 그대로 유지합니다');
    });
    ov.querySelector('#resetYesBtn').addEventListener('click', async ()=>{
      sites.forEach(s=>s.photos.forEach(p=>URL.revokeObjectURL(p.url)));
      sites.length = 0;
      await dbClear();
      ov.remove();
      renderSummary();
      showToast('데이터를 초기화했습니다');
    });
  }

  renderSummary();
  restoreFromBackup();
})();
</script>
<script>try{ if("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}</script>
</body>
</html>
